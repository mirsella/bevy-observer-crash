[package]
name = "bevy_observer_crash"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.17.3", features = [
  "multi_threaded",
  "bevy_picking",
  "bevy_ui",
  "bevy_winit",
  "experimental_bevy_ui_widgets",
] }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 0

[profile.release]
opt-level = 3
